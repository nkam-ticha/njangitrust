<svg xmlns="http://www.w3.org/2000/svg" width="64" height="32" viewBox="0 0 64 32" role="img" aria-label="Ndop band tile">
  <!-- NjangiTrust Ndop-inspired band, one seamless tile (repeat along x).
       Original geometry: sawtooth edges, paired panel rules, a lozenge, and a
       ring of eight seeds whose top seed is raffia (the beneficiary at 12 o'clock).
       Colours are brand constants (light indigo, cloud, raffia) in both themes.
       Remove the element with class="accent" (or set it to #F5F6FA) for the plain version. -->
  <rect width="64" height="32" fill="#1E2A5A"/>
  <g fill="#F5F6FA">
    <path d="M0 0h64l-4 4-4-4-4 4-4-4-4 4-4-4-4 4-4-4-4 4-4-4-4 4-4-4-4 4-4-4-4 4-4-4z"/>
    <path d="M0 32h64l-4-4-4 4-4-4-4 4-4-4-4 4-4-4-4 4-4-4-4 4-4-4-4 4-4-4-4 4-4-4-4 4-4-4z"/>
    <rect x="0.5" y="8" width="1" height="16"/>
    <rect x="30.5" y="8" width="1" height="16"/>
    <rect x="32.5" y="8" width="1" height="16"/>
    <rect x="62.5" y="8" width="1" height="16"/>
    <circle cx="16" cy="16" r="1.75"/>
    <circle cx="52.6" cy="11.4" r="1.3"/>
    <circle cx="54.5" cy="16" r="1.3"/>
    <circle cx="52.6" cy="20.6" r="1.3"/>
    <circle cx="48" cy="22.5" r="1.3"/>
    <circle cx="43.4" cy="20.6" r="1.3"/>
    <circle cx="41.5" cy="16" r="1.3"/>
    <circle cx="43.4" cy="11.4" r="1.3"/>
  </g>
  <path d="M16 9.25 22.75 16 16 22.75 9.25 16Z" fill="none" stroke="#F5F6FA" stroke-width="1.5" stroke-linejoin="miter"/>
  <circle class="accent" cx="48" cy="9.5" r="1.9" fill="#D9A520"/>
</svg>

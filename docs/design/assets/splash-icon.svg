<svg xmlns="http://www.w3.org/2000/svg" width="288" height="288" viewBox="0 0 288 288" role="img" aria-label="NjangiTrust">
  <!-- System splash icon (expo-splash-screen / Android 12+ splash API), transparent.
       Background colour: #1E2A5A in light mode, #141B3D in dark mode.
       The system splash can only show a centred icon, so the Ndop band and the
       wordmark belong to the in-app splash that follows it (see splash.svg). -->

  <g fill="#F5F6FA">
    <circle cx="191.02" cy="79.28" r="10"/>
    <circle cx="220.08" cy="119.28" r="10"/>
    <circle cx="220.08" cy="168.72" r="10"/>
    <circle cx="191.02" cy="208.72" r="10"/>
    <circle cx="144" cy="224" r="10"/>
    <circle cx="96.98" cy="208.72" r="10"/>
    <circle cx="67.92" cy="168.72" r="10"/>
    <circle cx="67.92" cy="119.28" r="10"/>
    <circle cx="96.98" cy="79.28" r="10"/>
  </g>
  <circle cx="144" cy="64" r="15" fill="#D9A520"/>
</svg>

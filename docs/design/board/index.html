<title>NjangiTrust Design Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="NjangiTrust design board: colour tokens with contrast, type scale, the NjangiRing, the ConfirmationCard states, and phone and wide web mockups.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;700&display=swap">
<style>
/* Layout concept: a calm review sheet on the app's own canvas. Sections stack;
   phone frames (360 x 800) wrap in a grid; wide frames (1280 x 800) scale to fit.
   Every colour is an app token from docs/design/DESIGN_SYSTEM.md section 2. */
:root {
  --indigo: #1E2A5A; --indigoInk: #1B2140; --night: #141B3D; --cloud: #F5F6FA; --line: #D9DCE6;
  --raffia: #D9A520; --paid: #2E7D4F; --late: #B42318; --pending: #A86A0B;
  --canvas: var(--cloud); --raised: #F5F6FA;
  --tint: rgba(27,33,64,.06); --bubble-own: rgba(30,42,90,.14); --bubble-other: rgba(27,33,64,.06);
  --selected: rgba(30,42,90,.10); --hover: rgba(27,33,64,.05); --disabled: rgba(27,33,64,.08);
  --danger-tint: rgba(180,35,24,.10); --scrim: rgba(20,27,61,.48);
  --text: var(--indigoInk); --text-2: rgba(27,33,64,.72); --on-primary: var(--cloud);
  --link: var(--indigo); --danger: var(--late); --primary: var(--indigo); --primary-pressed: #3C4770;
  --divider: var(--line); --outline: rgba(27,33,64,.56); --focus: var(--indigo);
  --raffia-keyline: var(--indigo); --on-raffia: var(--indigo);
  --brand-ground: #1E2A5A; --brand-motif: #F5F6FA;
  --bezel: #1B2140; --shadow-card: 0 2px 12px rgba(20,27,61,.10); --shadow-sheet: 0 -2px 24px rgba(20,27,61,.16);
  --font-display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --indigo: #AEBBF0; --indigoInk: #E8EBF6; --line: #313A66; --paid: #5DBB87; --late: #F08A7E; --pending: #C98A2E;
    --canvas: var(--night); --raised: #20284B;
    --tint: rgba(232,235,246,.08); --bubble-own: rgba(174,187,240,.20); --bubble-other: rgba(232,235,246,.08);
    --selected: rgba(174,187,240,.14); --hover: rgba(232,235,246,.06); --disabled: rgba(232,235,246,.10);
    --danger-tint: rgba(240,138,126,.14); --scrim: rgba(20,27,61,.72);
    --text-2: rgba(232,235,246,.72); --on-primary: var(--night); --primary-pressed: #98A5D7;
    --outline: rgba(232,235,246,.56); --raffia-keyline: var(--raffia); --on-raffia: var(--night);
    --bezel: #313A66; --shadow-card: none; --shadow-sheet: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --indigo: #AEBBF0; --indigoInk: #E8EBF6; --line: #313A66; --paid: #5DBB87; --late: #F08A7E; --pending: #C98A2E;
  --canvas: var(--night); --raised: #20284B;
  --tint: rgba(232,235,246,.08); --bubble-own: rgba(174,187,240,.20); --bubble-other: rgba(232,235,246,.08);
  --selected: rgba(174,187,240,.14); --hover: rgba(232,235,246,.06); --disabled: rgba(232,235,246,.10);
  --danger-tint: rgba(240,138,126,.14); --scrim: rgba(20,27,61,.72);
  --text-2: rgba(232,235,246,.72); --on-primary: var(--night); --primary-pressed: #98A5D7;
  --outline: rgba(232,235,246,.56); --raffia-keyline: var(--raffia); --on-raffia: var(--night);
  --bezel: #313A66; --shadow-card: none; --shadow-sheet: none;
  color-scheme: dark;
}

/* Page */
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--canvas); color: var(--text); font-family: var(--font-body); font-size: 16px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 64px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--canvas); }
* { box-sizing: border-box; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; text-wrap: balance; margin: 0; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 12px; }
.wrap { max-width: 1320px; margin: 0 auto; }

.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--canvas);
  border-bottom: 1px solid var(--divider); padding-block: 12px;
}
.topbar .wrap { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 19px; }
.brand svg { color: var(--link); }
.brand small { font-family: var(--font-body); font-weight: 400; font-size: 14px; color: var(--text-2); }
.toggles { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: inline-flex; background: var(--tint); border-radius: 999px; padding: 4px; gap: 2px; }
.seg button {
  border: 0; background: none; border-radius: 999px; padding: 0 14px; min-height: 40px; cursor: pointer;
  font-weight: 700; font-size: 14px; color: var(--text);
}
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
.toc { display: flex; flex-wrap: wrap; gap: 4px 16px; padding-top: 8px; font-size: 14px; }
.toc a { color: var(--link); font-weight: 700; text-decoration: none; padding: 6px 0; }
.toc a:hover { text-decoration: underline; }

section.board { padding-top: 48px; display: grid; gap: 20px; }
section.board > header { display: grid; gap: 8px; max-width: 70ch; }
section.board h2 { font-size: 24px; line-height: 30px; }
section.board header p, .note { color: var(--text-2); font-size: 16px; }
.note { font-size: 14px; max-width: 70ch; }
h3.sub { font-family: var(--font-body); font-size: 19px; line-height: 26px; }

/* Colour section */
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.swatch { border: 1px solid var(--divider); border-radius: 12px; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; }
.swatch .half { padding: 12px; display: grid; gap: 6px; min-height: 120px; align-content: start; }
.swatch .chip { height: 36px; border-radius: 8px; border: 1px solid rgba(127,127,127,.35); }
.swatch .name { font-weight: 700; font-size: 14px; }
.swatch .meta { font-size: 12px; line-height: 17px; font-variant-numeric: tabular-nums; }
.swatch .light { background: #F5F6FA; color: #1B2140; }
.swatch .dark { background: #141B3D; color: #E8EBF6; }
.swatch .light .meta { color: #585D74; }
.swatch .dark .meta { color: #ADB1C2; }
.pairs { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.pairs th, .pairs td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--divider); vertical-align: middle; }
.pairs th { font-weight: 700; }
.pairs td.num { text-align: right; }
.pairs .sample { display: inline-block; padding: 2px 8px; border-radius: 6px; font-weight: 700; }
.scroll-x { overflow-x: auto; border: 1px solid var(--divider); border-radius: 12px; }

/* Type section */
.type-row { display: grid; grid-template-columns: minmax(150px, 220px) 1fr; gap: 8px 16px; padding: 12px 0; border-bottom: 1px solid var(--divider); align-items: baseline; }
.type-row .spec { font-size: 12px; color: var(--text-2); line-height: 17px; }
@media (max-width: 560px) { .type-row { grid-template-columns: 1fr; } }

/* Frames */
.phones { display: flex; flex-wrap: wrap; gap: 28px 24px; align-items: flex-start; }
.phone-fig { display: grid; gap: 10px; margin: 0; max-width: 100%; }
.phone-fig figcaption { font-size: 14px; color: var(--text-2); max-width: 380px; }
.phone-fig figcaption b { color: var(--text); }
.phone { width: 380px; max-width: 100%; border-radius: 36px; background: var(--bezel); padding: 10px; }
.screen {
  width: 360px; max-width: 100%; height: 800px; border-radius: 26px; overflow: hidden; background: var(--canvas);
  display: flex; flex-direction: column; position: relative; color: var(--text); font-size: 16px; line-height: 22px;
}
.wide-holder { width: 100%; overflow: hidden; border: 1px solid var(--divider); border-radius: 12px; }
.wide-frame { width: 1280px; height: 836px; transform-origin: top left; background: var(--canvas); color: var(--text); font-size: 16px; line-height: 22px; }
.browser { height: 36px; background: var(--tint); display: flex; align-items: center; gap: 12px; padding: 0 16px; font-size: 13px; color: var(--text-2); border-bottom: 1px solid var(--divider); }
.browser .url { background: var(--canvas); border-radius: 999px; padding: 4px 16px; min-width: 360px; }
.wide { height: 800px; display: grid; grid-template-columns: 256px 1fr; }
.wide > * { min-height: 0; overflow: hidden; }

/* App shell */
.sb { height: 24px; flex: none; display: flex; justify-content: space-between; align-items: center; padding: 0 18px; font-size: 12px; font-weight: 700; }
.sb .ico { display: flex; gap: 6px; align-items: center; }
.gbar { height: 18px; flex: none; display: grid; place-items: center; }
.gbar::after { content: ""; width: 108px; height: 4px; border-radius: 2px; background: var(--text-2); }
.hdr { height: 56px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 4px 0 16px; }
.gs { display: flex; align-items: center; gap: 4px; font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 24px; min-width: 0; }
.gs span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gs svg { color: var(--text-2); flex: none; }
.ptitle { display: flex; align-items: center; gap: 4px; font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 30px; padding-left: 4px; }
.iconbtn { width: 48px; height: 48px; display: grid; place-items: center; position: relative; flex: none; color: var(--text); }
.count { position: absolute; top: 6px; right: 4px; min-width: 20px; height: 20px; border-radius: 999px; background: var(--primary); color: var(--on-primary); font-size: 12px; font-weight: 700; display: grid; place-items: center; padding: 0 5px; line-height: 1; }
.content { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; position: relative; }
.scrollpad { display: flex; flex-direction: column; gap: 12px; padding-bottom: 12px; }
.tabbar { height: 64px; flex: none; display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--divider); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; line-height: 17px; color: var(--text-2); position: relative; }
.tab .pill { width: 56px; height: 32px; border-radius: 999px; display: grid; place-items: center; position: relative; }
.tab.on { color: var(--link); font-weight: 700; }
.tab.on .pill { background: var(--selected); }
.tab .count { top: -2px; right: 2px; }
.dotbadge { position: absolute; top: 4px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
.side { border-right: 1px solid var(--divider); padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; }
.side .brandrow { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 19px; padding: 0 12px 20px; color: var(--text); }
.side .brandrow svg { color: var(--link); }
.navi { height: 48px; border-radius: 12px; display: flex; gap: 12px; align-items: center; padding: 0 12px; color: var(--text-2); position: relative; }
.navi.on { background: var(--selected); color: var(--link); font-weight: 700; }
.navi .count { position: static; margin-left: auto; }
.side .me { margin-top: auto; display: flex; gap: 12px; align-items: center; padding: 12px; border-top: 1px solid var(--divider); }

/* Text and amounts */
.t1 { font-weight: 700; }
.t2 { font-size: 14px; line-height: 20px; color: var(--text-2); }
.cap { font-size: 12px; line-height: 17px; color: var(--text-2); }
.amt { font-family: var(--font-display); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.amt .cur { font-size: 14px; color: var(--text-2); }
.amt.xl { font-size: 32px; line-height: 40px; font-weight: 700; }
.amt.xl .cur { font-size: 19px; }
.amt.lg { font-size: 24px; line-height: 30px; }
.amt.lg .cur { font-size: 16px; }
.amt.tot { font-size: 19px; line-height: 24px; font-weight: 700; }
.danger { color: var(--danger); }
.sec { font-weight: 700; font-size: 19px; line-height: 26px; padding: 16px 16px 4px; display: flex; justify-content: space-between; align-items: baseline; }
.sec .btn { height: auto; padding: 0; font-size: 16px; }

/* Rows and lists */
.rows { display: flex; flex-direction: column; }
.row { display: flex; gap: 12px; padding: 10px 16px; align-items: center; min-height: 56px; position: relative; }
.rows > .row + .row::before { content: ""; position: absolute; top: 0; left: var(--inset, 68px); right: 0; border-top: 1px solid var(--divider); }
.rows.noav > .row + .row::before { left: 16px; }
.row .rt { flex: 1; min-width: 0; }
.row .tr { display: grid; justify-items: end; gap: 0; }
.row.sel { background: var(--selected); }
.grouped { border: 1px solid var(--divider); border-radius: 12px; margin: 0 16px; overflow: hidden; }
.grouped .row + .row::before { left: 16px; }
.av { width: 40px; height: 40px; border-radius: 50%; background: var(--selected); color: var(--link); font-weight: 700; font-size: 14px; display: grid; place-items: center; flex: none; }
.av.s32 { width: 32px; height: 32px; font-size: 12px; }
.av.s56 { width: 56px; height: 56px; font-size: 19px; font-family: var(--font-display); }
.av.ben { box-shadow: 0 0 0 2px var(--canvas), 0 0 0 4px var(--raffia); }
.typeic { width: 40px; height: 40px; border-radius: 50%; background: var(--tint); display: grid; place-items: center; flex: none; color: var(--text); }
.block { border: 1px solid var(--divider); border-radius: 12px; padding: 16px; display: grid; gap: 10px; margin: 0 16px; }
.lbadge { height: 24px; border-radius: 999px; border: 1px solid var(--outline); padding: 0 8px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.bar { height: 8px; border-radius: 999px; background: var(--tint); position: relative; }
.bar .fill { position: absolute; inset: 0 auto 0 0; background: var(--primary); border-radius: 999px; }
.bar .tick { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--text); border-radius: 1px; }
.strip { display: flex; gap: 8px; align-items: center; padding: 12px 16px; font-size: 14px; line-height: 20px; color: var(--text-2); }
.strip.alert { background: var(--danger-tint); color: var(--text); border-radius: 12px; margin: 0 16px; }
.segc { margin: 4px 16px 0; background: var(--tint); border-radius: 999px; padding: 4px; display: grid; grid-template-columns: repeat(4, 1fr); flex: none; }
.segc span { height: 40px; border-radius: 999px; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.segc .on { background: var(--primary); color: var(--on-primary); }

/* Buttons, chips, fields */
.btn { min-height: 48px; border-radius: 12px; padding: 0 20px; font-family: var(--font-body); font-weight: 700; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; background: none; color: var(--link); white-space: nowrap; }
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn.secondary { border: 1.5px solid var(--primary); }
.btn.disabled { background: var(--disabled); color: var(--text-2); }
.btn.text { padding: 0 12px; }
.btn.block { width: 100%; }
.chips { display: flex; gap: 8px; padding: 8px 16px; overflow: hidden; flex: none; }
.chip { height: 40px; border-radius: 999px; border: 1px solid var(--outline); padding: 0 16px; font-weight: 700; font-size: 14px; color: var(--link); display: inline-flex; align-items: center; white-space: nowrap; flex: none; }
.chip.on { background: var(--primary); color: var(--on-primary); border-color: var(--primary); gap: 6px; }
.composer { display: flex; gap: 4px; align-items: center; padding: 0 8px 8px; flex: none; }
.field { flex: 1; min-height: 48px; border: 1px solid var(--outline); border-radius: 12px; display: flex; align-items: center; padding: 0 14px; color: var(--text-2); }
.roundbtn { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--text); }
.roundbtn.fill { background: var(--primary); color: var(--on-primary); }
.input { border: 1px solid var(--outline); border-radius: 12px; min-height: 56px; display: flex; align-items: center; padding: 0 16px; gap: 12px; }
.input.focus { border: 2px solid var(--primary); padding: 0 15px; }
.input .prefix { color: var(--text-2); border-right: 1px solid var(--divider); padding-right: 12px; }
.label { font-size: 14px; font-weight: 700; }
.choice { display: flex; gap: 12px; align-items: center; min-height: 56px; padding: 0 16px; border: 1px solid var(--divider); border-radius: 12px; }
.radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--outline); display: grid; place-items: center; flex: none; }
.radio.on { border-color: var(--primary); }
.radio.on::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }

/* Conversation and chat */
.conv { display: flex; flex-direction: column; gap: 12px; padding: 12px 0; }
.datesep { text-align: center; font-size: 12px; font-weight: 700; color: var(--text-2); }
.msg { display: flex; padding: 0 16px; gap: 8px; align-items: flex-start; }
.msg.own { justify-content: flex-end; }
.bubble { max-width: 80%; padding: 8px 12px; border-radius: 12px; background: var(--bubble-other); }
.msg.own .bubble { background: var(--bubble-own); }
.bubble.agent { background: none; border: 1px solid var(--divider); }
.bubble .time { font-size: 12px; line-height: 17px; color: var(--text-2); margin-left: 8px; float: right; margin-top: 4px; display: inline-flex; gap: 2px; align-items: center; }
.who { font-size: 14px; font-weight: 700; line-height: 20px; }
.who.agent { color: var(--link); }
.who small { font-weight: 400; color: var(--text-2); font-size: 12px; margin-left: 4px; }
.mention { color: var(--link); font-weight: 700; }
.agent-turn { display: grid; grid-template-columns: 16px 1fr; gap: 8px; padding: 0 16px; }
.agent-turn > svg { color: var(--link); margin-top: 3px; }
.agent-turn p + p { margin-top: 6px; }
.sys { display: flex; gap: 6px; justify-content: center; align-items: flex-start; text-align: center; font-size: 14px; line-height: 20px; color: var(--text-2); padding: 0 28px; }
.sys svg { flex: none; margin-top: 2px; }
.activity { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--text-2); padding: 0 16px 0 40px; }
.voice { display: flex; align-items: center; gap: 10px; min-width: 228px; }
.voice .play { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; flex: none; }
.voice .track { flex: 1; height: 4px; border-radius: 2px; background: var(--outline); position: relative; }
.voice .track i { position: absolute; inset: 0 62% 0 0; background: var(--primary); border-radius: 2px; }
.voice .track b { position: absolute; left: 38%; top: -4px; width: 12px; height: 12px; border-radius: 50%; background: var(--primary); margin-left: -6px; }
.voice .speed { height: 28px; min-width: 40px; border-radius: 999px; border: 1px solid var(--outline); font-size: 12px; font-weight: 700; display: grid; place-items: center; padding: 0 8px; }
.statusheader { display: flex; gap: 12px; align-items: center; padding: 8px 4px 12px 16px; border-bottom: 1px solid var(--divider); flex: none; }
.statusheader .lines { flex: 1; min-width: 0; }
.statusheader .l3 { display: flex; gap: 6px; align-items: center; font-size: 14px; line-height: 20px; }
.pinstrip { display: flex; gap: 8px; align-items: center; padding: 10px 16px; font-size: 14px; border-bottom: 1px solid var(--divider); }
.banner { display: flex; gap: 8px; align-items: center; padding: 10px 16px; font-size: 14px; background: var(--tint); }
.banner .btn { margin-left: auto; min-height: 36px; padding: 0 8px; }

/* ConfirmationCard */
.ccard { background: var(--raised); border: 1px solid var(--divider); border-radius: 20px; padding: 20px; box-shadow: var(--shadow-card); display: grid; gap: 12px; }
.ccard .ctitle { font-weight: 700; font-size: 19px; line-height: 26px; display: flex; gap: 8px; align-items: center; }
.ccard .ctitle .lbadge { margin-left: auto; }
.ccard .line { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.ccard .line.total { border-top: 1px solid var(--divider); padding-top: 12px; font-weight: 700; }
.ccard .cnote { display: flex; gap: 8px; font-size: 14px; line-height: 20px; color: var(--text-2); }
.ccard .cnote svg { flex: none; margin-top: 2px; }
.ccard .cactions { display: flex; gap: 8px; margin-top: 4px; }
.ccard .cactions .btn.primary, .ccard .cactions .btn.disabled { flex: 1; }
.ccard .status { display: flex; gap: 12px; align-items: flex-start; }
.ccard .status .t1 { line-height: 22px; }
.failbox { background: var(--danger-tint); border-radius: 12px; padding: 12px; }
.ref { font-size: 14px; color: var(--text-2); }
.spinner { width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid var(--pending); border-right-color: transparent; flex: none; animation: spin 900ms linear infinite; margin-top: 1px; }
.spinner.small { width: 14px; height: 14px; border-width: 2px; border-color: var(--text-2); border-right-color: transparent; }
@keyframes spin { to { transform: rotate(360deg); } }
.cardgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; align-items: start; }
.cardgrid figure { margin: 0; display: grid; gap: 8px; }
.cardgrid figcaption { font-size: 14px; color: var(--text-2); }
.cardgrid figcaption b { color: var(--text); }

/* Sheets, PIN, band */
.scrim { position: absolute; inset: 0; background: var(--scrim); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--raised); border-radius: 20px 20px 0 0; border: 1px solid var(--divider); border-bottom: 0; box-shadow: var(--shadow-sheet); overflow: hidden; display: flex; flex-direction: column; }
.handle { width: 32px; height: 4px; border-radius: 2px; background: var(--outline); margin: 8px auto 0; flex: none; }
.sheethead { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 4px 20px; font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 24px; }
.sheetbody { padding: 0 20px 16px; display: grid; gap: 12px; }
.ndop { display: block; width: 100%; height: 32px; flex: none; }
.pindots { display: flex; gap: 16px; justify-content: center; padding: 8px 0; }
.pindot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--outline); }
.pindot.on { background: var(--primary); border-color: var(--primary); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); padding: 0 24px; }
.key { height: 60px; display: grid; place-items: center; font-weight: 700; font-size: 24px; }

/* Ring */
.ring-stage { display: flex; flex-wrap: wrap; gap: 24px 40px; align-items: center; }
.ring-stage figure { margin: 0; display: grid; gap: 8px; justify-items: center; }
.ring-stage figcaption { font-size: 14px; color: var(--text-2); text-align: center; }
.ringbox { position: relative; display: inline-block; line-height: 0; }
.ringbox .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: normal; pointer-events: none; }
.ringbox .center .of { font-size: 14px; color: var(--text-2); line-height: 20px; }
.ringbox svg circle.dot-hit { cursor: pointer; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 14px; }
.legend span { display: inline-flex; gap: 8px; align-items: center; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.controls .btn { min-height: 44px; }
.controls label { font-size: 14px; font-weight: 700; display: inline-flex; gap: 10px; align-items: center; }
.controls input[type="range"] { width: 200px; max-width: 50vw; accent-color: var(--primary); }
.density { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; }
.pulse-layer { transform-box: fill-box; transform-origin: center; }

@media (prefers-reduced-motion: reduce) {
  .spinner { animation: none; }
}
@media (max-width: 420px) {
  .phone { padding: 6px; border-radius: 30px; }
  .screen { border-radius: 24px; }
}

    sweep(svg, 'large', function () { ringComplete = true; renderRing(); });
  });
  document.getElementById('btn-reset').addEventListener('click', function () {
    ringState = MEMBERS.map(function (m) { return Object.assign({}, m); }); ringComplete = false; renderRing();
  });
  var resizeTimer;
  window.addEventListener('resize', function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(fitWide, 80); });

  var savedTheme = load('nt-board-theme'), savedLang = load('nt-board-lang');
  if (savedTheme === 'light' || savedTheme === 'dark') setTheme(savedTheme);
  if (savedLang === 'en') LANG = 'en';
  document.querySelectorAll('[data-lang-choice]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-lang-choice') === LANG)); });
  renderAll();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitWide);
})();
</script>
